name: PropTech Multi-Agent Full Stack CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend-test-and-eval:
    name: Backend Pytest & Agent Evals (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Unit, Integration, and Agent Evaluation Tests
        env:
          USE_IN_MEMORY_MONGO_FALLBACK: "true"
          DATABASE_URL: "sqlite+aiosqlite:///./test_ci.db"
          JWT_SECRET_KEY: "ci_jwt_secret_key_proptech_autonomous_agent"
        run: |
          pytest tests/unit tests/integration tests/evals -v

  frontend-check-and-build:
    name: Frontend Typecheck & Next.js Build (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Build Next.js 15 production bundle
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: npm run build
